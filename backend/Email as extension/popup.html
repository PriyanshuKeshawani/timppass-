<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mail Copilot Settings</title>
  <style>
    * { box-sizing: border-box; font-family: "Google Sans", Roboto, Arial, sans-serif; }
    body { width: 320px; margin: 0; padding: 14px; background: #ffffff; color: #1f1f1f; }
    h3 { margin: 0 0 10px 0; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #444746; margin-bottom: 4px; }
    input, textarea {
      width: 100%; padding: 7px 10px; border: 1px solid #c4c7c5; border-radius: 8px;
      font-size: 12px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; font-size: 12px; }
    button {
      width: 100%; padding: 8px; border: none; border-radius: 18px;
      background: #0b57d0; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #0842a0; }
    .msg { margin-top: 8px; font-size: 12px; color: #0b57d0; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <h3>📨 Mail Copilot Settings</h3>

  <div class="field">
    <label>Composio API Key (ak_...)</label>
    <input type="password" id="composioKey" placeholder="ak_..." />
  </div>

  <div class="field">
    <label>Groq API Key (gsk_...)</label>
    <input type="password" id="groqKey" placeholder="gsk_..." />
  </div>

  <div class="field">
    <label>Academic / Default Signature (Auto-appended)</label>
    <textarea id="signature" placeholder="Regards,&#10;Your Name&#10;Department / College"></textarea>
  </div>

  <div class="row">
    <span>24/7 Cloud Auto-Reply</span>
    <input type="checkbox" id="autoReply" style="width:auto" />
  </div>

  <button id="saveBtn">Save Settings</button>
  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
